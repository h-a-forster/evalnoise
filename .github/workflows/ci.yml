name: CI

# No push trigger: Actions minutes are metered while the repository is private.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.13"

      - name: Install
        run: uv sync --locked --group dev

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: windows-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: uv sync --locked --group dev

      - name: Test
        run: uv run pytest

      - name: CLI smoke
        run: |
          uv run evalnoise --version
          uv run evalnoise power --components item=400,item_arm=60,run=20,item_run=100,within=300 --tasks 20,50 --runs 1,4 --mde 12
          uv run evalnoise components results/trials/agent-ab-no-tests.csv --score-col passed --scale 100 --bootstrap 50
