# Source tables for the study. Paths are relative to the repository root and expect the
# source repositories checked out next to this one:
#   git clone https://github.com/h-a-forster/mm-arena ../mm-arena   (and agent-ab, overclaim,
#   ruleproof). Regenerate with: uv run evalnoise extract
# mm-arena: every replicate run is committed in results/core-v1 (on its branch
# polish-2026-10-30 until that is merged; the extractor still accepts
# several roots, merging them and failing if a shared episode differs).

[[table]]
name = "mm-arena"
extractor = "mm-arena"
repo = "https://github.com/h-a-forster/mm-arena"
paths = ["../mm-arena/results/core-v1"]
description = "core-v1 suite: 60 games x 2 seeds, LLM market makers, edge captured (pp) per episode"

[[table]]
name = "agent-ab-no-tests"
extractor = "agent-ab"
repo = "https://github.com/h-a-forster/agent-ab"
paths = ["../agent-ab/docs/results/haiku-5-5-no-tests"]
description = "Claude Code on Haiku 5.5, control vs no-tests instruction, 50 tasks x 3 repeats"

[[table]]
name = "agent-ab-haiku-vs-sonnet"
extractor = "agent-ab"
repo = "https://github.com/h-a-forster/agent-ab"
paths = ["../agent-ab/docs/results/haiku-vs-sonnet-5-5"]
description = "Claude Code, Haiku 5.5 vs Sonnet 5.5, 50 tasks x 1 repeat"

[[table]]
name = "overclaim-setups"
extractor = "agent-ab"
repo = "https://github.com/h-a-forster/overclaim"
paths = ["../overclaim/results/setups"]
description = "Claude Code, Haiku/Sonnet 5.5 at low/high effort, 23 tasks x 2 repeats"

[[table]]
name = "overclaim-interventions"
extractor = "agent-ab"
repo = "https://github.com/h-a-forster/overclaim"
paths = ["../overclaim/results/interventions"]
description = "Claude Code on Haiku 5.5, four completion-check interventions, 18 tasks x 4 repeats"

[[table]]
name = "ruleproof-main"
extractor = "ruleproof"
repo = "https://github.com/h-a-forster/ruleproof"
paths = ["../ruleproof/bench/results"]
runs = ["base1", "p2", "p3"]
rename = { "base1:claude-sonnet" = "sonnet-short" }
description = "AGENTS.md compliance, 9 arms x 5 tasks x 3 repeats; hook arms run twice (p2, p3) on different hook builds"

[[table]]
name = "ruleproof-pressure"
extractor = "ruleproof"
repo = "https://github.com/h-a-forster/ruleproof"
paths = ["../ruleproof/bench/results"]
runs = ["pt1"]
description = "AGENTS.md compliance under pressure tasks, 6 arms x 5 tasks x 3 repeats (opus 1 repeat)"
